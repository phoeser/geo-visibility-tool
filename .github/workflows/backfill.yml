# Manueller Workflow: rechnet alle historischen Run-Daten mit der aktuellen
# metrics.py neu. Nutze, wenn die Detection-Logik gefixed wurde und alte
# Runs realistische Zahlen brauchen.
#
# Trigger: GitHub UI -> Actions -> "Backfill historische Brand-Metriken" -> Run workflow

name: Backfill historische Brand-Metriken

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Nur Runs ab diesem ISO-Datum (leer = alle)'
        required: false
        default: ''
      dry_run:
        description: 'Dry-Run (nur loggen, nichts schreiben)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

# 18.08.2026 (Opus-Review #8): Dieselbe Schreibgruppe wie analyze/revert-backfill/
# search-ab-test. Der 15.08.-Fix nannte analyze.yml "den einzigen schreibenden
# Workflow ohne Gruppe" - dieser hier schreibt aber auch (data/runs + push) und
# konnte einem laufenden Wochencrawl per force-with-lease den Commit wegschiessen.
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run backfill
        env:
          # 18.08.2026: Inputs nicht mehr direkt in die Shell interpolieren,
          # sondern ueber env reichen und quoten (Injection-Flaeche geschlossen).
          IN_SINCE: ${{ github.event.inputs.since }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "$IN_SINCE" ]; then
            ARGS="$ARGS --since $IN_SINCE"
          fi
          if [ "$IN_DRY" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "[BACKFILL] Args: $ARGS"
          python3 -m tools.backfill_brand_metrics $ARGS

      - name: Commit + push (only if not dry_run)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/runs/)" ]; then
            echo "[BACKFILL] Keine Aenderungen, nichts zu commiten."
            exit 0
          fi
          git add data/runs/
          git commit -m "chore(backfill): re-compute brand metrics with new disambig logic"
          # Push mit retry (kann race mit nightly run)
          for i in 1 2 3 4 5; do
            if git push; then
              echo "[BACKFILL] Push erfolgreich (Versuch $i)"
              exit 0
            fi
            echo "[BACKFILL] Push fehlgeschlagen, retry $((i+1))"
            git fetch origin main
            git rebase origin/main || git rebase --abort
            sleep 3
          done
          # 18.08.2026: Der force-with-lease-Anker ist gestrichen. Nach einem
          # "rebase --abort" haette die frisch gefetchte Lease gehalten und den
          # Commit eines parallel gelaufenen Crawls ueberschrieben. Ein manuell
          # gestarteter Backfill darf schlicht rot werden - neu starten kostet
          # nichts, ein ueberschriebener 80-Minuten-Crawl schon.
          echo "[BACKFILL] Push nach 5 Versuchen fehlgeschlagen - bitte erneut starten."
          exit 1
